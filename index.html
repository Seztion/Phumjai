<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phumjau - Heavenly Angel</title>
    <!-- นำเข้าฟอนต์น่ารัก มนๆ สไตล์การ์ตูน -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. พื้นหลังท้องฟ้าสวรรค์ + ก้อนเมฆลอย
           ========================================= */
        body {
            background: linear-gradient(to bottom, #1d222d, #2d3446); /* ท้องฟ้าตอนกลางคืน/สวรรค์โทนเข้ม ถนอมสายตา */
            color: #2d3748;
            font-family: 'Mali', 'Poppins', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* เมฆลอยฉากหลัง */
        .sky-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            pointer-events: none;
            animation: moveClouds linear infinite;
        }

        .sky-cloud::before, .sky-cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
        }

        .cloud-1 { width: 140px; height: 45px; top: 15%; left: -150px; animation-duration: 25s; }
        .cloud-1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud-1::after { width: 70px; height: 70px; top: -35px; right: 20px; }

        .cloud-2 { width: 200px; height: 60px; top: 65%; left: -220px; animation-duration: 35s; animation-delay: 5s; }
        .cloud-2::before { width: 80px; height: 80px; top: -30px; left: 30px; }
        .cloud-2::after { width: 90px; height: 90px; top: -40px; right: 30px; }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(110vw); }
        }

        /* =========================================
           2. ตัวการ์ดขาวขอบดำ น่ารักๆ
           ========================================= */
        .card-container {
            position: relative;
            width: 370px;
            background: #ffffff;
            border: 3.5px solid #1a1a1a; /* ขอบดำหนานุ่มน่ารัก */
            border-radius: 32px;
            box-shadow: 0 12px 0px #1a1a1a, 0 20px 30px rgba(0, 0, 0, 0.3); /* เงาสไตล์การ์ตูน Pop-art */
            overflow: hidden;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-container:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 0px #1a1a1a, 0 25px 35px rgba(0, 0, 0, 0.4);
        }

        .banner-wrapper {
            position: relative;
            height: 125px;
            overflow: hidden;
            background-color: #e2e8f0;
            border-bottom: 3.5px solid #1a1a1a;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 0 20px 20px 20px;
            text-align: center;
        }

        /* =========================================
           3. รูปโปรไฟล์ + แสงออร่าสวรรค์ (รูปไม่หมุน)
           ========================================= */
        .avatar-wrapper {
            margin-top: -50px;
            margin-bottom: 8px;
            display: inline-block;
            position: relative;
        }

        /* ปีกนางฟ้าขนาบข้าง */
        .avatar-wrapper::before, .avatar-wrapper::after {
            font-size: 42px;
            position: absolute;
            top: 10px;
            z-index: 1;
            filter: drop-shadow(2px 2px 0px #1a1a1a);
            animation: floatWings 3s ease-in-out infinite alternate;
        }

        .avatar-wrapper::before { content: '🕊️'; left: -42px; }
        .avatar-wrapper::after { content: '🕊️'; right: -42px; transform: scaleX(-1); }

        @keyframes floatWings {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* ✨ แสงออร่าสวรรค์เรืองแสงด้านหลังรูป */
        .heaven-aura {
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 20%, rgba(255, 230, 150, 0.6) 60%, transparent 80%);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 45px rgba(255, 220, 120, 0.6);
            z-index: 1;
            animation: auraPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes auraPulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.12); opacity: 1; }
        }

        /* กรอบรูปทรงกลม ขาวขอบดำ */
        .avatar-frame {
            position: relative;
            z-index: 2;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3.5px solid #1a1a1a;
            background: #ffffff;
            box-shadow: 0 4px 0px #1a1a1a;
            overflow: hidden;
        }

        /* รูปโปรไฟล์ นิ่งสงบ ไม่หมุน */
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detective-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 4px 0 0 0;
            color: #1a1a1a;
        }

        .case-code {
            font-size: 0.8rem;
            color: #4a5568;
            font-weight: 700;
            margin-bottom: 14px;
        }

        /* ☁️ กล่องข้อความก้อนเมฆ ขาวขอบดำ */
        .vtuber-lore {
            font-size: 0.88rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 18px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 22px;
            border: 2.5px solid #1a1a1a;
            box-shadow: 3px 3px 0px #1a1a1a;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ☁️ ปุ่มกดขาวขอบดำ น่ารักๆ */
        .btn-link {
            text-decoration: none;
            color: #1a1a1a;
            background: #ffffff;
            border: 2.5px solid #1a1a1a;
            padding: 10px;
            border-radius: 18px;
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 3px 3px 0px #1a1a1a;
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background: #f1f5f9;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #1a1a1a;
        }

        .btn-link:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px #1a1a1a;
        }

        /* ปุ่มโดเนทเน้นน่ารัก */
        .btn-donate {
            background: #fef08a; /* สีเหลืองอ่อนพาสเทลน่ารัก */
        }

        .btn-donate:hover {
            background: #fde047;
        }

        .info-grid {
            margin-top: 18px;
            border-top: 2.5px dashed #1a1a1a;
            padding-top: 14px;
        }

        .info-title {
            font-size: 0.75rem;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .tag-list {
            list-style: none;
            padding: 0;
            margin: 0 0 12px 0;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .tag-item {
            font-size: 0.75rem;
            font-weight: 700;
            background: #ffffff;
            color: #1a1a1a;
            padding: 4px 10px;
            border-radius: 14px;
            border: 2px solid #1a1a1a;
            box-shadow: 2px 2px 0px #1a1a1a;
            transition: 0.2s;
        }

        .tag-item:hover {
            background: #1a1a1a;
            color: #ffffff;
            cursor: pointer;
        }

        .credits {
            display: flex;
            justify-content: space-around;
            font-size: 0.72rem;
            color: #4a5568;
            font-weight: 700;
        }

        /* ละอองดาว/ขนนกโปรยปราย */
        .snowflake {
            position: fixed;
            top: -10px;
            color: #ffffff;
            font-size: 1rem;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ก้อนเมฆลอยฉากหลัง -->
    <div class="sky-cloud cloud-1"></div>
    <div class="sky-cloud cloud-2"></div>

    <div class="card-container">

        <div class="banner-wrapper">
            <img src="112.png" alt="VTuber Banner" class="banner-img">
        </div>

        <div class="card-content">
            
            <div class="avatar-wrapper">
                <!-- ✨ แสงออร่าสวรรค์เรืองแสง -->
                <div class="heaven-aura"></div>
                
                <!-- กรอบและรูปโปรไฟล์ (ไม่หมุน) -->
                <div class="avatar-frame">
                    <img src="avatar.png" alt="VTuber Model" class="avatar-img">
                </div>
            </div>

            <h1 class="detective-title">Phumjau</h1>
            <div class="case-code">☁️ [ LITTLE ANGEL ] ☁️</div>
            
            <!-- ☁️ กล่องข้อความก้อนเมฆ ขาวขอบดำ -->
            <p class="vtuber-lore">
                "เทวดาตัวน้อยที่แอบลงมาจากสวรรค์เพื่อมาสร้างความสุขให้ทุกคน! ✨"
            </p>

            <div class="links-group">
                <a href="https://tiktok.com" class="btn-link" target="_blank">
                    <span>🎵 TIKTOK OFFICIAL</span>
                </a>

                <a href="https://discord.gg" class="btn-link" target="_blank">
                    <span>⚔️ HQ DISCORD SERVER</span>
                </a>

                <a href="https://tipme.in.th" class="btn-link btn-donate" target="_blank">
                    <span>🤍 FUNDING & DONATE (สนับสนุน)</span>
                </a>
            </div>

            <div class="info-grid">
                <div class="info-title">ANGEL HASHTAGS</div>
                <ul class="tag-list">
                    <li class="tag-item">#PhumjauLIVE</li>
                    <li class="tag-item">#PhumjauArt</li>
                    <li class="tag-item">#PhumjauMeme</li>
                </ul>

                <div class="credits">
                    <span><b>MAMA:</b> @ArtistName</span>
                    <span><b>PAPA:</b> @RiggerName</span>
                </div>
            </div>

        </div>

    </div>

    <!-- สคริปต์ปล่อยละอองดาว/ขนนกโปรยปราย -->
    <script>
        function createSnowflake() {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            
            const icons = ['✨', '🪶', '✧', '🤍', '☁️'];
            flake.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.animationDuration = Math.random() * 3 + 4 + 's'; 
            flake.style.opacity = Math.random() * 0.7 + 0.3;
            flake.style.fontSize = Math.random() * 12 + 10 + 'px';

            document.body.appendChild(flake);

            setTimeout(() => {
                flake.remove();
            }, 7000);
        }

        setInterval(createSnowflake, 300);
    </script>

</body>
</html>
